<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Clone</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/pieces/wN.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>
<body>
  <main class="app">
    <div id="status" class="status" role="status" aria-live="polite" data-state="thinking">
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-text">Cargando…</span>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" aria-label="Tablero de ajedrez"></div>
    </div>

    <div class="controls">
      <button id="btn-reset" class="btn" type="button" title="Empezar una partida nueva">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
        Reiniciar partida
      </button>
      <button id="btn-flip" class="btn" type="button" title="Ver el tablero desde el otro lado">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16"/><path d="M3 8l4-4 4 4"/><path d="M17 20V4"/><path d="M13 16l4 4 4-4"/></svg>
        Girar tablero
      </button>
    </div>
  </main>
</body>
</html>
